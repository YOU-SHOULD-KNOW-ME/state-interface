<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>State Interface - Gallery</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px;background:#faf1e1;color:#39291f;font:15px/1.6 system-ui}main{max-width:1000px;margin:auto}h1{font-size:28px}.layout{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}.stage{border-radius:18px;background:#30242a;border:1px solid #9a704d;padding:20px}canvas{display:block;width:240px;height:320px;image-rendering:pixelated}.controls{flex:1;min-width:260px}label{display:block;margin:12px 0}button,select{padding:9px 14px;border:1px solid #a47451;border-radius:7px;background:#edcda4;color:#4a2b20;font:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ac512f;outline-offset:2px}input{width:100%;accent-color:#ac512f}.buttons{display:flex;gap:8px;flex-wrap:wrap}.hint{color:#77533e}pre{padding:16px;background:#eedfc8;border-radius:10px;white-space:pre-wrap}a{color:#994b30}
</style><main><h1>State Interface</h1><p class="hint">Seven host-supplied states. One independent canvas. No account or network integration.</p><div class="layout"><div class="stage"><canvas id="actor"></canvas></div><section class="controls"><label>State <select id="state"></select></label><label>Completion variant <select id="variant"><option value="random">Random on entry</option><option value="victory">Victory gesture</option><option value="sign">Checkmark paddle</option></select></label><div class="buttons"><button id="restart">Restart state</button><button id="pause">Pause</button><button id="play">Play</button></div><label>Seek within this cycle <input id="seek" type="range" min="0" max="6000" value="0"></label><pre id="snapshot" aria-live="polite">Loading assets...</pre><p class="hint">Pause and seek without changing the chosen completion variant. The question marks and ZZZ are included in the canvas output.</p><a href="../README.md">Read the API documentation</a></section></div></main><script type="module" src="gallery.js"></script></html>
